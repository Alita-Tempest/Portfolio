<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Board artwork not published">
  <defs>
    <pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#7d8a84" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243029"/>
      <stop offset="1" stop-color="#161e1a"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#g)"/>
  <rect width="640" height="400" fill="url(#p)"/>

  <!-- board outline, chamfered -->
  <path d="M120 92h380l28 28v190l-28 28H120l-28-28V120z" fill="#1b241f" stroke="#c98a3f" stroke-opacity=".5" stroke-width="1.5"/>

  <!-- mounting holes -->
  <g fill="none" stroke="#c98a3f" stroke-opacity=".45" stroke-width="1.3">
    <circle cx="116" cy="116" r="5"/><circle cx="504" cy="116" r="5"/>
    <circle cx="116" cy="314" r="5"/><circle cx="504" cy="314" r="5"/>
  </g>

  <!-- traces -->
  <g fill="none" stroke="#c98a3f" stroke-opacity=".34" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 150h58l18-18h64"/>
    <path d="M150 178h40l20 20h74"/>
    <path d="M150 262h72l16-16h56"/>
    <path d="M470 150h-52l-18 18h-48"/>
    <path d="M470 214h-96"/>
    <path d="M470 278h-58l-18-18h-52"/>
    <path d="M290 300v22l16 16h84"/>
  </g>

  <!-- vias -->
  <g fill="#1b241f" stroke="#c98a3f" stroke-opacity=".55" stroke-width="1.2">
    <circle cx="208" cy="150" r="3.4"/><circle cx="210" cy="198" r="3.4"/>
    <circle cx="222" cy="262" r="3.4"/><circle cx="418" cy="150" r="3.4"/>
    <circle cx="412" cy="278" r="3.4"/><circle cx="306" cy="322" r="3.4"/>
  </g>

  <!-- die -->
  <rect x="272" y="176" width="96" height="72" fill="#222d26" stroke="#c98a3f" stroke-opacity=".55" stroke-width="1.4"/>
  <circle cx="284" cy="188" r="3.2" fill="#c98a3f" fill-opacity=".7"/>

  <!-- pads -->
  <g fill="#c98a3f" fill-opacity=".45">
    <rect x="140" y="145" width="10" height="10"/><rect x="140" y="173" width="10" height="10"/>
    <rect x="140" y="257" width="10" height="10"/><rect x="470" y="145" width="10" height="10"/>
    <rect x="470" y="209" width="10" height="10"/><rect x="470" y="273" width="10" height="10"/>
  </g>

  <g font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#8fa199" letter-spacing="2.5">
    <text x="320" y="216" font-size="13" text-anchor="middle" fill="#c98a3f" fill-opacity=".85">U1</text>
    <text x="320" y="356" font-size="11" text-anchor="middle">ARTWORK NOT PUBLISHED</text>
    <text x="92" y="80" font-size="10">REV —</text>
    <text x="548" y="80" font-size="10" text-anchor="end">KVST</text>
  </g>
</svg>
